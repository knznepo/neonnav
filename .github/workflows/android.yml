# Builds an installable Android APK in the cloud.
#   - Every push to main (or "Run workflow" in the Actions tab): APK attached to the run as an artifact.
#   - Pushing a tag like v1.0.0: also publishes a GitHub Release with the APK, giving a direct download link.
name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # required by Capacitor 7
          cache: gradle

      - name: Build web app and copy it into the Android project
        env:
          # Optional Foursquare business search through your proxy (repo secret FSQ_PROXY).
          # Never put the raw Foursquare key here: this repo and its APKs are public.
          VITE_FSQ_PROXY: ${{ secrets.FSQ_PROXY }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Signed release build with the permanent key, so installed apps can be updated
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/neonnav.p12"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/neonnav.p12"
            ./gradlew assembleRelease --no-daemon
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set: building with a throwaway debug key (installed copies can't be updated in place)"
            ./gradlew assembleDebug --no-daemon
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Name the APK
        run: |
          mkdir -p out
          cp "$APK_PATH" "out/NeonNav-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NeonNav-android
          path: out/*.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
